[project]
name = "eventsphere-common"
version = "0.1.0"
description = "Shared utilities for EventSphere microservices: DB base, JWT auth, RabbitMQ event bus, settings."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pika>=1.3",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eventsphere_common*"]
